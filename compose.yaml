services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: matchlens
      POSTGRES_USER: matchlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - matchlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchlens -d matchlens"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  matchlens_pgdata:
